services:
  api:
    container_name: dasovbot_api
    image: ghcr.io/volkovskiyda/telegram-bot-api
    restart: always
    pull_policy: always
    # --local lets sendVideo take the bot's file:///media/... URIs and read
    # the file from disk instead of receiving a multipart upload
    command: --local
    environment:
      TELEGRAM_API_ID: $TELEGRAM_API_ID
      TELEGRAM_API_HASH: $TELEGRAM_API_HASH
    volumes:
      # Must be mounted at the same container path as in the bot service:
      # the file:// URIs the bot sends are resolved in this filesystem
      - ./config/media/:/media
    # memswap == mem: no swap, so a leak OOM-kills the container (restart:
    # always brings it back) instead of thrashing the whole host
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - 8081:8081

  bot:
    container_name: dasovbot
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
    restart: always
    image: ghcr.io/volkovskiyda/dasovbot
    pull_policy: always
    volumes:
      - ./config/data/:/data
      - ./config/media/:/media
      - ./config/export/:/export
    environment:
      BASE_URL: http://api:8081/bot
      # The api service above runs with --local, so uploads go by file path
      LOCAL_MODE: "true"
      READ_TIMEOUT: $READ_TIMEOUT
      BOT_TOKEN: $BOT_TOKEN
      LOADING_VIDEO_ID: $LOADING_VIDEO_ID
      ANIMATION_FILE_ID: $ANIMATION_FILE_ID
      DEVELOPER_CHAT_ID: $DEVELOPER_CHAT_ID
      DEVELOPER_ID: $DEVELOPER_ID
      CONFIG_FOLDER: /
      EMPTY_MEDIA_FOLDER: $EMPTY_MEDIA_FOLDER
      DASHBOARD_PASSWORD: $DASHBOARD_PASSWORD
      DASHBOARD_PORT: $DASHBOARD_PORT
      # Compose only uses .env for substitution: without this passthrough the
      # flag never reaches the container, so behind a reverse proxy the rate
      # limiter keys on the proxy's IP and the cookie is never marked Secure
      DASHBOARD_BEHIND_PROXY: $DASHBOARD_BEHIND_PROXY
      BACKUP_CRON: ${BACKUP_CRON:-0 */12 * * *}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-14}
      # Without a cap, glibc creates a malloc arena per executor thread and
      # freed upload buffers never return to the OS, so RSS only ratchets up
      MALLOC_ARENA_MAX: "2"
    # memswap == mem: no swap, so a leak OOM-kills the container (restart:
    # always brings it back) instead of thrashing the whole host.
    # 4g leaves headroom while local_mode file-path uploads prove out in
    # production; once confirmed, this can drop to ~2g since uploads no
    # longer pass through Python memory
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
