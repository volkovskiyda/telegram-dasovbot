name: Docker Image Build Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  repository_dispatch:
    types: [yt-dlp-release]

env:
  owner: ${{ github.repository_owner }}
  repository: ${{ github.repository_owner }}/dasovbot
  registry: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests --ignore=tests/integration

  check-yt-dlp-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      yt_dlp_version: ${{ steps.check.outputs.yt_dlp_version }}
    steps:
      - name: Check yt-dlp latest release
        id: check
        run: |
          if ! latest_release=$(curl -sf "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" | jq -r .tag_name); then
            echo "Error: Failed to fetch latest yt-dlp release"
            exit 1
          fi
          echo "yt_dlp_version=$latest_release" >> $GITHUB_OUTPUT
          
          previous_version=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -o 'yt-dlp version: [^ ]*' | cut -d' ' -f3 || echo "none")
          
          echo "Latest yt-dlp version: $latest_release"
          
          is_new_version=false
          if [[ "$latest_release" != "$previous_version" ]]; then
            is_new_version=true
            echo "New yt-dlp version detected: $latest_release (previous: $previous_version)"
          fi
          
          if [[ "$is_new_version" == "true" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Building new Docker image with yt-dlp version: $latest_release (previous: $previous_version)"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No new yt-dlp version. Current: $latest_release"
          fi

  build:
    needs: [test, check-yt-dlp-release]
    # Never publish from a pull request: a new yt-dlp release would otherwise
    # make should_build true and push :latest / cut a release from unmerged code.
    if: github.event_name != 'pull_request' && needs.check-yt-dlp-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # One release at a time: two concurrent runs would otherwise pick the same
    # free tag, and an older build could overwrite a newer :latest.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ env.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag is the UTC date; a second release the same day gets .1, then .2 etc.
      # Checks git tags, not releases: gh release create reuses an existing tag.
      - name: Version
        id: version
        run: |
          date="$(date -u +'%Y.%m.%d')"
          version="$date"; n=0
          while git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; do
            n=$((n+1)); version="$date.$n"
          done
          echo "date=$date" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.repository }}:${{ steps.version.outputs.version }},
            ${{ env.repository }}:latest,
            ${{ env.registry }}/${{ env.repository }}:${{ steps.version.outputs.version }},
            ${{ env.registry }}/${{ env.repository }}:latest

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Build date: ${{ steps.version.outputs.date }}
          yt-dlp version: ${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}"
